# Copy to secret.yaml, replace every value, and keep that file out of version control.
apiVersion: v1
kind: Secret
metadata:
  name: baseapikey-secrets
  namespace: baseapikey
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@POSTGRES_HOST:5432/baseapikey
  REDIS_URL: redis://REDIS_HOST:6379
  JWT_ACCESS_SECRET: replace-with-unique-random-secret-at-least-32-chars
  JWT_REFRESH_SECRET: replace-with-another-unique-random-secret-32-chars
  NINE_ROUTER_API_KEY: replace-with-real-provider-key
  NINE_ROUTER_BASE_URL: https://api.9router.com/v1
  PROVIDER_ENCRYPTION_KEY: replace-with-base64-encoded-32-byte-key
  ACCOUNT_EMAIL_WEBHOOK_URL: https://mailer.example.com/events
  ACCOUNT_EMAIL_WEBHOOK_SECRET: replace-with-unique-random-secret-at-least-32-chars
  BILLING_PROVIDER_NAME: payment-provider
  BILLING_PROVIDER_URL: https://payments.example.com/api
  BILLING_PROVIDER_API_KEY: replace-with-real-payment-key
  BILLING_WEBHOOK_SECRET: replace-with-unique-random-secret-at-least-32-chars
  METRICS_TOKEN: replace-with-unique-random-secret-at-least-32-chars
  CORS_ORIGIN: https://console.example.com
  DASHBOARD_PUBLIC_URL: https://console.example.com
  GATEWAY_PUBLIC_URL: https://api.example.com
  ERROR_REPORTING_WEBHOOK_URL: https://errors.example.com/events
  ERROR_REPORTING_WEBHOOK_SECRET: replace-with-unique-random-secret-at-least-32-chars
