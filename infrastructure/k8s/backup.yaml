apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-backups
  namespace: baseapikey
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-backup
  namespace: baseapikey
spec:
  schedule: '17 2 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command: ['/bin/sh', '-ec']
              args:
                - |
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" --file="/backups/baseapikey-$stamp.dump"
                  find /backups -type f -name 'baseapikey-*.dump' -mtime +14 -delete
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: baseapikey-secrets
                      key: DATABASE_URL
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: database-backups
