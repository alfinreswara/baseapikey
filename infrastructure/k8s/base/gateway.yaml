apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: baseapikey
  labels: &gateway-labels
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: baseapikey
spec:
  replicas: 2
  selector:
    matchLabels: *gateway-labels
  template:
    metadata:
      labels: *gateway-labels
    spec:
      serviceAccountName: baseapikey
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Release artifact pinned by infrastructure/k8s/overlays/production.
          image: ghcr.io/alfinreswara/baseapikey-gateway:RELEASE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: baseapikey-config
            - secretRef:
                name: baseapikey-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          # No preStop hook is configured on purpose. The runtime image is
          # distroless and contains no /bin/sh, so a shell based hook can never
          # run. Kubernetes sends SIGTERM to the Node process (PID 1) instead,
          # and the Gateway handles it: it reports itself as not ready, drains
          # traffic for SHUTDOWN_DRAIN_DELAY_MS, stops accepting connections,
          # waits for in-flight requests, and then closes Redis and PostgreSQL.
          # The grace period must stay above SHUTDOWN_TIMEOUT_MS so the
          # process can exit on its own before Kubernetes sends SIGKILL.
          terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: baseapikey
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: baseapikey
spec:
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: baseapikey
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: baseapikey
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/part-of: baseapikey
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: baseapikey
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
