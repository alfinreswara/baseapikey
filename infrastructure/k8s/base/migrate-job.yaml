apiVersion: batch/v1
kind: Job
metadata:
  name: baseapikey-migrate
  namespace: baseapikey
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  # The Prisma schema engine waits for the database. A database that accepts
  # the connection but never answers would block the rollout forever, so the
  # job is bound to a deadline.
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # The migration job runs from the Gateway image so that the Prisma
          # schema and the migration history always match the application
          # release. The overlay pins it to the same release artifact as the
          # Gateway Deployment.
          image: ghcr.io/alfinreswara/baseapikey-gateway:RELEASE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command:
            # The runtime image is distroless: it ships the Node binary at
            # /nodejs/bin/node and does not add that directory to PATH, so the
            # executable has to be addressed by its absolute path.
            #
            # The job runs with a read only root filesystem. The Prisma CLI
            # and the schema engine were verified against that layout: they
            # only read the schema, the migrations, and the engine binaries.
            # The single write attempt of the CLI is its engine version cache
            # under $HOME/.cache/prisma. It fails harmlessly on a read only
            # filesystem and does not stop the migration.
            - /nodejs/bin/node
            - node_modules/prisma/build/index.js
            - migrate
            - deploy
            - --schema=node_modules/@baseapikey/database/prisma/schema.prisma
          envFrom:
            - configMapRef:
                name: baseapikey-config
            - secretRef:
                name: baseapikey-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
