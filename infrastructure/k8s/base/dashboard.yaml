apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: baseapikey
  labels: &dashboard-labels
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: baseapikey
spec:
  replicas: 2
  selector:
    matchLabels: *dashboard-labels
  template:
    metadata:
      labels: *dashboard-labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          # Release artifact pinned by infrastructure/k8s/overlays/production.
          image: ghcr.io/alfinreswara/baseapikey-dashboard:RELEASE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: baseapikey-config
          env:
            - name: DASHBOARD_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: baseapikey-secrets
                  key: DASHBOARD_PUBLIC_URL
            - name: GATEWAY_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: baseapikey-secrets
                  key: GATEWAY_PUBLIC_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          # The distroless runtime image has no shell, so no shell based preStop
          # hook can be used. Kubernetes sends SIGTERM to the Node process and
          # the Dashboard drains traffic before it stops accepting connections.
          terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: baseapikey
spec:
  selector:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: baseapikey
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dashboard
  namespace: baseapikey
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
      app.kubernetes.io/part-of: baseapikey
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dashboard
  namespace: baseapikey
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dashboard
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
