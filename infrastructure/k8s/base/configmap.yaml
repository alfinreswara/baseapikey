apiVersion: v1
kind: ConfigMap
metadata:
  name: baseapikey-config
  namespace: baseapikey
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '3000'
  TRUST_PROXY: '10.0.0.0/8'
  LOG_LEVEL: info
  DATABASE_POOL_SIZE: '10'
  REDIS_CONNECT_TIMEOUT_MS: '5000'
  LOGIN_RATE_LIMIT_MAX_ATTEMPTS: '5'
  LOGIN_RATE_LIMIT_WINDOW_MS: '900000'
  HEALTH_CHECK_TIMEOUT_MS: '5000'
  MODEL_CATALOG_CACHE_TTL_SECONDS: '300'
  PROVIDER_HEALTH_CHECK_INTERVAL_MS: '60000'
  USAGE_QUEUE_BATCH_SIZE: '50'
  USAGE_QUEUE_INTERVAL_MS: '250'
  MAX_REQUEST_SIZE: '1048576'
  # Traffic drain window and total shutdown budget used by the Gateway and the
  # Dashboard when they receive SIGTERM. The drain window keeps the process
  # serving in-flight requests while the readiness probe reports the pod as
  # not ready. The termination grace period of both Deployments must stay
  # above SHUTDOWN_TIMEOUT_MS so the process can exit before SIGKILL.
  SHUTDOWN_DRAIN_DELAY_MS: '10000'
  SHUTDOWN_TIMEOUT_MS: '30000'
  # Interval of the recovery of the credit reservations whose request can no
  # longer be running.
  RESERVATION_RECOVERY_INTERVAL_MS: '60000'
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  DASHBOARD_PORT: '3001'
  DASHBOARD_HOST: 0.0.0.0
