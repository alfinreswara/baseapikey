name: baseapikey

services:
  postgres:
    image: postgres:16-alpine
    container_name: baseapikey-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: baseapikey
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d baseapikey']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - baseapikey-network

  redis:
    image: redis:7-alpine
    container_name: baseapikey-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - baseapikey-network

networks:
  baseapikey-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
