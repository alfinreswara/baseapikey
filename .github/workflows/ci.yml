# ==============================================================================
# BaseAPIKey CI Foundation Pipeline
# Runs code, browser, migration, dependency, and image verification on changes
# ==============================================================================

name: CI Foundation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new push occurs on the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm run type-check

  lint:
    name: ESLint Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm run test

  build:
    name: Build Applications & Packages
    runs-on: ubuntu-latest
    needs:
      [
        type-check,
        lint,
        format,
        test,
        dashboard-e2e,
        migration-check,
        dependency-audit,
        infrastructure-security,
        secret-scan,
      ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Build hardened Gateway image
        run: docker build -f infrastructure/docker/Dockerfile.gateway -t baseapikey-gateway:ci .

      - name: Build hardened Dashboard image
        run: docker build -f infrastructure/docker/Dockerfile.dashboard -t baseapikey-dashboard:ci .

      - name: Scan Gateway image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: baseapikey-gateway:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library
          version: v0.74.0

      - name: Scan Dashboard image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: baseapikey-dashboard:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library
          version: v0.74.0

      - name: Generate Gateway CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: baseapikey-gateway:ci
          format: cyclonedx
          output: baseapikey-gateway.cdx.json
          exit-code: '0'
          version: v0.74.0

      - name: Generate Dashboard CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: baseapikey-dashboard:ci
          format: cyclonedx
          output: baseapikey-dashboard.cdx.json
          exit-code: '0'
          version: v0.74.0

      - name: Upload image SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: container-sboms
          path: |
            baseapikey-gateway.cdx.json
            baseapikey-dashboard.cdx.json
          if-no-files-found: error
          retention-days: 30

  dashboard-e2e:
    name: Dashboard Browser E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium runtime
        run: pnpm --filter @baseapikey/dashboard exec playwright install --with-deps chromium

      - name: Run Dashboard browser E2E
        run: pnpm --filter @baseapikey/dashboard test:e2e

  migration-check:
    name: Prisma Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baseapikey_ci
          POSTGRES_USER: baseapikey
          POSTGRES_PASSWORD: baseapikey_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baseapikey -d baseapikey_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://baseapikey:baseapikey_ci_password@localhost:5432/baseapikey_ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty database
        run: pnpm --filter @baseapikey/database exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: pnpm --filter @baseapikey/database exec prisma migrate status --schema prisma/schema.prisma

  dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  infrastructure-security:
    name: Infrastructure Misconfiguration Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Docker and Kubernetes configuration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: infrastructure
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.74.0

  secret-scan:
    name: Repository Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository for committed secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          skip-dirs: node_modules,.turbo,**/dist,apps/dashboard/test-results
          version: v0.74.0
