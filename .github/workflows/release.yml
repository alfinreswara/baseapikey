name: Build Release Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version, for example v1.2.3
        required: true
        type: string
      publish:
        description: Push the scanned images to GitHub Container Registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  # The platforms of the release. The dry run builds and scans exactly these
  # platforms, the result of the dry run therefore covers the architectures
  # that the publication uses.
  RELEASE_PLATFORMS: linux/amd64,linux/arm64
  # The temporary tag of the image in the scan registry. It is never a release
  # tag: the release tags are created from the digest of the scanned image
  # after the security gate passed.
  SCAN_TAG: scan-${{ github.sha }}

jobs:
  images:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    # The arm64 image is built with emulation, the job needs more than the
    # default budget.
    timeout-minutes: 90
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: infrastructure/docker/Dockerfile.gateway
          - service: dashboard
            dockerfile: infrastructure/docker/Dockerfile.dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release request
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Release images must be built from the main branch" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semantic version text such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The local scan registry of the dry run is reachable under the host
          # name of the runner.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      # The dry run scans the same way the release scans: the image is pushed
      # to a registry and every platform of it is scanned there. The dry run
      # uses a registry of the runner, it never writes to GitHub Container
      # Registry and it never needs a registry credential.
      - name: Start the local scan registry
        if: ${{ !inputs.publish }}
        run: |
          docker run -d --name release-scan-registry -p 5000:5000 registry:2
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/v2/ >/dev/null 2>&1; then
              echo "The local scan registry is ready"
              exit 0
            fi
            sleep 2
          done
          echo "The local scan registry did not become ready" >&2
          exit 1

      - name: Resolve the scan registry
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "SCAN_IMAGE=ghcr.io/${{ github.repository_owner }}/baseapikey-${{ matrix.service }}" >> "$GITHUB_ENV"
          else
            echo "SCAN_IMAGE=localhost:5000/baseapikey-${{ matrix.service }}" >> "$GITHUB_ENV"
          fi

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is pushed to the scan tag, never to a release tag. The
      # release tags are created from the digest of this image after the
      # security gate passed.
      - name: Build the image and push it to the scan registry
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.RELEASE_PLATFORMS }}
          push: true
          provenance: ${{ inputs.publish && 'mode=max' || 'false' }}
          sbom: ${{ inputs.publish }}
          tags: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}

      # The gate. Every platform that the release publishes is scanned, the
      # scan covers the packages of the operating system and the libraries, and
      # a finding of HIGH or CRITICAL fails the step and therefore the job.
      # The release tags are created after these steps, a failed scan stops
      # the publication.
      - name: Scan linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.74.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ inputs.publish && github.actor || '' }}
          TRIVY_PASSWORD: ${{ inputs.publish && secrets.GITHUB_TOKEN || '' }}

      - name: Scan linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.74.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_USERNAME: ${{ inputs.publish && github.actor || '' }}
          TRIVY_PASSWORD: ${{ inputs.publish && secrets.GITHUB_TOKEN || '' }}

      # The SBOM of every published platform. The report is generated from the
      # scanned image, it describes the artifact that is published.
      - name: Generate the SBOM of linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.74.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}
          format: cyclonedx
          output: baseapikey-${{ matrix.service }}-${{ inputs.version }}-linux-amd64.cdx.json
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ inputs.publish && github.actor || '' }}
          TRIVY_PASSWORD: ${{ inputs.publish && secrets.GITHUB_TOKEN || '' }}

      - name: Generate the SBOM of linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.74.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}
          format: cyclonedx
          output: baseapikey-${{ matrix.service }}-${{ inputs.version }}-linux-arm64.cdx.json
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_USERNAME: ${{ inputs.publish && github.actor || '' }}
          TRIVY_PASSWORD: ${{ inputs.publish && secrets.GITHUB_TOKEN || '' }}

      - name: Upload release SBOM
        uses: actions/upload-artifact@v7
        with:
          name: baseapikey-${{ matrix.service }}-${{ inputs.version }}-sbom
          path: baseapikey-${{ matrix.service }}-${{ inputs.version }}-*.cdx.json
          if-no-files-found: error
          retention-days: 90

      # The publication. The release tags are a carbon copy of the scanned
      # image, the digest of the release tag is the digest of the image that
      # was scanned. The scan tag is a temporary artifact of the gate, it is
      # removed and it is never referenced by a deployment.
      - name: Publish the release tags
        if: inputs.publish
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/baseapikey-${{ matrix.service }}
          SCAN_IMAGE: ${{ env.SCAN_IMAGE }}
          SCAN_TAG: ${{ env.SCAN_TAG }}
          SCAN_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/publish-release-image.mjs
