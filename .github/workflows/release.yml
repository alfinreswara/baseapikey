name: Build Release Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version, for example v1.2.3
        required: true
        type: string
      publish:
        description: Push the scanned images to GitHub Container Registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  # The platforms of the release. The dry run builds and scans exactly these
  # platforms, the result of the dry run therefore covers the architectures
  # that the publication uses.
  RELEASE_PLATFORMS: linux/amd64,linux/arm64
  # The tag of the image in the scan registry. It is never a release tag: the
  # release tags are created from the digest of the scanned image after the
  # security gate passed.
  SCAN_TAG: scan-${{ github.sha }}

jobs:
  images:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    # The arm64 image is built with emulation, the job needs more than the
    # default budget.
    timeout-minutes: 90
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: infrastructure/docker/Dockerfile.gateway
          - service: dashboard
            dockerfile: infrastructure/docker/Dockerfile.dashboard
    env:
      # The image is built and scanned in a registry of the runner. The
      # temporary artifact of the gate is never in a public registry, in the
      # dry run and in the release.
      SCAN_REGISTRY: localhost:5000
      SCAN_IMAGE: localhost:5000/baseapikey-${{ matrix.service }}
      RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/baseapikey-${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release request
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Release images must be built from the main branch" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semantic version text such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The scan registry of the runner is reachable under the host name of
          # the runner.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      # The scan registry of the runner. It holds the image while it is
      # scanned, it is not reachable from another host, and it disappears with
      # the runner. The image of the gate is never in a public registry.
      - name: Start the scan registry
        run: |
          docker run -d --name release-scan-registry -p 5000:5000 registry:2
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/v2/ >/dev/null 2>&1; then
              echo "The scan registry is ready"
              exit 0
            fi
            sleep 2
          done
          echo "The scan registry did not become ready" >&2
          exit 1

      # The image is pushed to the scan registry, never to a release tag and
      # never to a public registry. The release tags are created from the
      # digest of this image after the security gate passed.
      - name: Build the image and push it to the scan registry
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.RELEASE_PLATFORMS }}
          push: true
          # The attestations are inlined in the image, they are copied with it
          # and they reach the published image unchanged.
          provenance: mode=max
          sbom: true
          tags: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}

      # The gate. Every platform that the release publishes is scanned, the
      # scan covers the packages of the operating system and the libraries,
      # and a finding of HIGH or CRITICAL fails the step and therefore the
      # job. The publication runs after these steps, a failed scan stops the
      # publication.
      - name: Scan linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.74.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library
        env:
          TRIVY_PLATFORM: linux/amd64

      - name: Scan linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.74.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library
        env:
          TRIVY_PLATFORM: linux/arm64

      # The SBOM of every published platform. The report is generated from the
      # scanned image, it describes the artifact that is published.
      - name: Generate the SBOM of linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.74.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}
          format: cyclonedx
          output: baseapikey-${{ matrix.service }}-${{ inputs.version }}-linux-amd64.cdx.json
        env:
          TRIVY_PLATFORM: linux/amd64

      - name: Generate the SBOM of linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.74.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}:${{ env.SCAN_TAG }}
          format: cyclonedx
          output: baseapikey-${{ matrix.service }}-${{ inputs.version }}-linux-arm64.cdx.json
        env:
          TRIVY_PLATFORM: linux/arm64

      - name: Upload release SBOM
        uses: actions/upload-artifact@v7
        with:
          name: baseapikey-${{ matrix.service }}-${{ inputs.version }}-sbom
          path: baseapikey-${{ matrix.service }}-${{ inputs.version }}-*.cdx.json
          if-no-files-found: error
          retention-days: 90

      # The publication. The image of the scan registry is copied to GitHub
      # Container Registry with the digest it has after the scan. The copy
      # preserves the digest, the published image is the scanned image.
      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release tags
        if: inputs.publish
        env:
          SCAN_REGISTRY: ${{ env.SCAN_REGISTRY }}
          SCAN_IMAGE: ${{ env.SCAN_IMAGE }}
          SCAN_TAG: ${{ env.SCAN_TAG }}
          SCAN_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_IMAGE: ${{ env.RELEASE_IMAGE }}
          RELEASE_VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/publish-release-image.mjs

      # The temporary artifact of the gate. The registry of the runner
      # disappears with the runner, the container is removed explicitly so that
      # the log of the run shows it.
      - name: Remove the scan registry
        if: always()
        run: |
          if docker ps -a --filter name=release-scan-registry --format '{{.Names}}' | grep -q release-scan-registry; then
            docker rm -f release-scan-registry && echo "The scan registry was removed"
          else
            echo "The scan registry was already gone"
          fi
