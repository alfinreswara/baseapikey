name: Build Release Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version, for example v1.2.3
        required: true
        type: string
      publish:
        description: Push the scanned images to GitHub Container Registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  images:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: infrastructure/docker/Dockerfile.gateway
          - service: dashboard
            dockerfile: infrastructure/docker/Dockerfile.dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release request
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Release images must be built from the main branch" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semantic version text such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/baseapikey-${{ matrix.service }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha,prefix=sha-

      - name: Build release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.publish && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.publish }}
          load: ${{ !inputs.publish }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: ${{ inputs.publish && 'mode=max' || 'false' }}
          sbom: ${{ inputs.publish }}

      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.metadata.outputs.json).tags[0] }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library
          version: v0.74.0

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.metadata.outputs.json).tags[0] }}
          format: cyclonedx
          output: baseapikey-${{ matrix.service }}-${{ inputs.version }}.cdx.json
          exit-code: '0'
          version: v0.74.0

      - name: Upload release SBOM
        uses: actions/upload-artifact@v7
        with:
          name: baseapikey-${{ matrix.service }}-${{ inputs.version }}-sbom
          path: baseapikey-${{ matrix.service }}-${{ inputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 90
